name: Mise à jour des données

on:
  schedule:
    - cron: '15 3,10,16 * * *' # trois fois par jour (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      # GitHub suspend les tâches planifiées d'un dépôt sans activité depuis 60 jours :
      # réactiver le workflow à chaque passage remet ce compteur à zéro.
      - run: gh workflow enable donnees.yml
        env:
          GH_TOKEN: ${{ github.token }}
      # Chaque déploiement donne une adresse neuve au script et au style : le navigateur
      # ne peut pas marier une nouvelle page avec un ancien script resté en cache.
      - run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::8}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::8}\"/" index.html
      - run: rm -rf .git .github scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
